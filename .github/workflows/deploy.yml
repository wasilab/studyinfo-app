name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Static-assets-only Workers need Wrangler 4; the action's default is much older.
          wranglerVersion: '4'
          command: deploy
